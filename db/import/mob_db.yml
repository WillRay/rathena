#=============================================================
# iz_dun05 - Undersea Tunnel F6 (Byalan), back-ported from
# renewal (db/re/mob_db.yml:50297-50347, 50419-50626, 50653-50688)
# and rebalanced for pre-renewal, transcendent level 90-99.
#
# Spawns:  npc/custom/mobs/iz_dun05.txt
# Skills:  db/import/mob_skill_db.txt
# Entry:   npc/custom/warps/iz_dun05.txt (iz_dun04 237,39)
#
# Same treatment as the mag_dun03 block above. What changed from
# the renewal source, and why:
#
#  * Attack/Attack2 are MIN/MAX here, not base/matk, so every
#    pair is re-authored rather than copied. They are kept
#    deliberately low - this map's difficulty is meant to come
#    from cast frequency and HP pools, not melee damage.
#
#  * Defense is a straight % damage reduction pre-renewal. The
#    renewal values (44-480) would make King Dramoh literally
#    immune; the range here is 26-55, under Lava Golem's 68 in
#    the mag_dun03 block. MagicDefense is capped at 45 for the
#    same reason - Sropho and Kraken sit at the cap since they
#    are the casters.
#
#  * Agi and Vit are pulled down from renewal inflation.
#
#  * Exp is tuned to match mag_dun03 so the two maps are peers
#    as a 90->99 path. The spawn-weighted average here is
#    ~66.5k BaseExp (60 Sedora + 50 Sropho + 30 Pot Dofle +
#    25 King Dramoh) against mag_dun03's ~65.8k.
#
#  * Drops: Shadowdecon -> Bradium on Kraken. Zelunium has no
#    source on this map at all (only Shadowdecon is dropped
#    here; the _Ore variants and Zelunium belong to EP17.1
#    Illusion content), so Carnium is spread across the normals
#    instead, matching how the mag_dun03 roster carries both.
#    None of 25728-25731 are created.
#
#  * Kraken's Bs_Making_S (23817) is dropped entirely. It does
#    not exist pre-renewal and its script calls
#    getgroupitem(IG_BS_MAKING_S), a group that exists only in
#    db/re/item_group_db.yml - not worth porting for one MVP
#    roll. Mistic_Frozen takes its place.
#
#  * Cards split by slot. Weapon-slot cards on this server are
#    regular cards, not shadow cards, so Sedora and Sropho drop
#    the classic 4521 / 4522 - created in
#    db/import/item_db_cards.yml, since neither existed in
#    pre-renewal. The other three are non-weapon and become
#    shadow cards at the canonical id + 26000 (30523-30525,
#    db/import/item_db_card_shadows.yml) so
#    npc/custom/card_merchant.txt's base-id arithmetic keeps
#    working.
#
#  * Equipment. This dungeon originally dropped no new gear -
#    Sedora's Tidal_Shoes was the only piece, an existing pre-re
#    item at a raised rate. Four pieces of the mag_dun03 Lava
#    Leather set were then moved here and renamed to match:
#
#      Tidal Suits   (15379, Armor)   Sedora        Rate  40
#      Tidal Hood    (20937, Garment) Sropho        Rate  40
#      Tidal Muffler (20936, Garment) Pot Dofle     Rate  40
#      Tidal Armor   (15378, Armor)   King Dramoh   Rate  20
#      Tidal Suits + Tidal Armor      Kraken        Rate 200
#
#    Rate 40 on a field mob is 2% effective after item_rate_equip
#    (1000, conf/import/battle_conf.txt) - the same rate they had
#    on mag_dun03. King Dramoh is Class: Boss, so its roll goes
#    through item_rate_equip_boss (also 1000) and Rate 20 lands
#    on the same 2%. Kraken's 200 is 20%, matching what Rigid
#    Muspellskoll gave for the same two armors. Each mob is at
#    exactly MAX_MOB_DROP (10) now, so nothing more fits without
#    dropping something.
#
#    The pairing is by role: Sropho is the caster and takes the
#    cast-time garment, Sedora already anchors the Tidal name via
#    the shoes, and the ATK/DEF armor sits on the boss.
#
# 2206 KRAKEN_LEG is defined but never spawned by the script -
# Kraken summons it via NPC_SUMMONSLAVE, so it has to exist.
#
# Mob IDs are unchanged; these are official kRO mobs the client
# already has sprites and names for, so no mob_avail alias and
# no client-side name table work is needed.
#=============================================================
