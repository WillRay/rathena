# ============================================================
# Ruined Geffen Act 0 - Geffen Magic Tournament duelists
# npc/custom/quests/ch1_act0_tournament.txt
#
# SPRITES. Monster IDs and NPC sprite IDs share one job-ID space
# client-side, so a mob whose Id is a sprite ID renders as that
# sprite with no client edit. Both IDs below are confirmed in
# D:\Client luafiles514/lua files/datainfo/npcidentity.lub.
#
# BUT: rAthena rejects any monster ID outside 1000-3999 or
# 20020-31999 (MIN_MOB_DB, mob.cpp:61). The 4_GEFFEN_* sprites
# are 665-682 and CANNOT be monster IDs. Gravity duplicated the
# same tournament artwork into 2549-2562 as GEFFEN_MAGE_*
# exactly so it could be used for monsters - use that range.
#
# THE ROSTER IS CANON. These are the official Geffen Magic
# Tournament fighters, taken from db/re/mob_db.yml - which does
# NOT load on this pre-renewal server, so they have to be copied
# here to exist at all. Names, sprites and skill kits are
# Gravity's; the numbers below are not (see TUNING).
#
# Ladder order, matching the Marshal's table in the script:
#   1  2549  Arhi                     the open-heats novice
#   2  2550  Dio Anemos               academy truant
#   3  2551/2552/2553  street thug    ONE of the three, at random
#   4  2554  Faymont                  Prontera's pride
#   5  2555  Ordre                    caster
#   6  2556  Blut Hase                the bruiser
#   7  2561  Elarion                  never dies, walks out
#
# TUNING. Per this server's convention: high HP and frequent
# low-level casts, never raw ATK. The official entries are
# RENEWAL scale - 100,000 to 1,000,000 HP at levels 90-120 -
# against an 80-99 pre-renewal solo band, so HP and Level are
# pulled down hard and ATK is pulled down with them. The official
# SKILL kits needed no such treatment: they are already Firebolt
# 5, Firewall 1, Frost Diver 5, Stone Curse 5, Grand Cross 5.
#
# Two further departures from the official entries:
#   - Ai is 21 throughout, not 04, matching Elarion below and the
#     duelists these replaced.
#   - Blut Hase is NEUTRAL. Official has him Ghost 2, which cuts
#     neutral physical damage to a quarter - fine for an optional
#     renewal boss, not for a mandatory story round that a
#     Knight has to be able to finish.
#
# No drops on any of them - it is a duel, not a hunt.
