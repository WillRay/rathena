#=============================================================
# mag_dun03 - Nogg Road 3F ("Rigid" family), back-ported from
# renewal (db/re/mob_db.yml:102662-103010, 103269-103329) and
# rebalanced for pre-renewal, transcendent level 90-99.
#
# Spawns:  npc/custom/mobs/mag_dun03.txt
# Skills:  db/import/mob_skill_db.txt
# Entry:   npc/custom/warps/mag_dun03.txt (mag_dun02 246,70)
#
# What changed from the renewal source, and why:
#
#  * Attack/Attack2 are MIN/MAX here, not base/matk. The renewal
#    values are meaningless under pre-re semantics (Blazer would
#    read as min 2158 / max 1555) so every pair is re-authored.
#
#  * Defense is a straight % damage reduction pre-renewal, so a
#    mob at DEF 100 is literally immune. The renewal values
#    (194-791) are replaced with 26-68. Lava Golem's 68 is just
#    under Ice Titan's 71, the pre-re high-water mark for a
#    farmable mob.
#
#  * MagicDefense is capped at 45 for the same reason - wizards
#    are the primary pre-re leveling class. Lava Golem inverts
#    the pattern (DEF 68 / MDEF 20) so magic is the answer to it
#    while Kaho and Nightmare Terror punish casters instead.
#
#  * Agi and Vit are pulled down from renewal inflation. Mob flee
#    is level+agi and mob soft DEF scales off Vit as a FLAT
#    subtraction on top of the % from Defense, so renewal's
#    Agi 149 / Vit 179 would stack into something unhittable.
#
#  * Exp is tuned so the map is the primary 90->99 path. The
#    spawn-weighted average is ~65.8k BaseExp; against the trans
#    curve (1,002,274,900 base for 90->99) and this server's 5x
#    base_exp_rate that is ~3,050 kills. JobExp runs ~1.05x so
#    job 50->70 finishes at roughly the same kill count.
#
#  * Drops: Shadowdecon(_Ore) -> Bradium, Zelunium(_Ore) ->
#    Carnium. Magma_Essence is dropped entirely (its script is
#    laphine_upgrade(), and there is no pre-re laphine system).
#    RandomOptionGroup: MAGMA3 is dropped - renewal's own groups
#    were never back-ported. The Armor/Garment/Shoes groups used
#    below are this server's own, in
#    db/import/item_randomopt_group.yml.
#    Lava Leather rates went 50 -> 20 because item_rate_equip is
#    1000 (10x) in conf/import/battle_conf.txt, then 20 -> 40
#    (2% effective per field mob) once the set was given random
#    options: a piece is only worth farming if you can re-roll it,
#    so the drop has to land often enough to be re-rolled. The MVP's
#    three armors went 100 -> 200 on the same reasoning, and boss
#    drops use item_rate_equip_boss, which is also 1000 - so those
#    are 20% each, not 2%.
#
#  * Four of the nine Lava Leather pieces have since been moved
#    off this map and onto iz_dun05, renamed to the Tidal set:
#    Lava Leather Armor -> Tidal Armor (15378), Lava Leather
#    Suit -> Tidal Suits (15379), Lava Leather Muffler -> Tidal
#    Muffler (20936), Lava Leather Hood -> Tidal Hood (20937).
#    Stats are untouched; see the header in
#    db/import/item_db.yml. The mobs below lost these drops:
#    Rigid Blazer (Suits), Rigid Earth Deleter (Armor), Rigid
#    Kaho (Hood), Rigid Lava Golem (Muffler), and Rigid
#    Muspellskoll (Suits + Armor, keeping the Robe). Rigid Earth
#    Deleter is now the one mob on this map with no gear drop -
#    it still carries its own card, Bradium and Carnium.
#
#  * Cards: every Rigid mob drops its OWN card - no Rigid mob
#    shares a card with the classic monster it is a palette of.
#    Six of the eight get a new shadow card (30452, 30455-30459
#    in db/import/item_db_card_shadows.yml), matching the
#    convention already used by 256 monsters in pre-re/mob_db.yml.
#    The two weapon-slot ones are the exception: weapon cards on
#    this server are regular cards, not shadow cards, so Rigid
#    Kaho and Rigid Lava Golem drop Firm_Kaho_Card (27347) and
#    Firm_Lava_G_Card (27348) from db/import/item_db_cards.yml,
#    keeping their renewal ids. Every card carries the effect of
#    the renewal Firm_* card verbatim.
#
#    Previously five of the eight dropped a card that already
#    belonged to another monster - Nightmare Terror (1379),
#    Deleter (1384), Deleter_ (1385), Kaho (1072) and Lava Golem
#    (1366) all still drop those same cards in pre-re/mob_db.yml.
#
# Mob IDs are deliberately unchanged - a mob's view id is its mob
# id, and the client already maps 20372-20419 to the *_mj sprites
# in npcidentity.lub / jobname.lub, so no mob_avail alias needed.
#=============================================================
