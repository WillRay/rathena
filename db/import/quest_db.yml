###########################################################################
# Quest Database
###########################################################################
#
# Quest Settings
#
###########################################################################
# - Id                     Quest ID.
#   Title                  Quest title.
#   TimeLimit              Amount of time before the quest expires. (Default: 0)
#   Targets:               Quest objective target. (Default: null)
#     - Mob                Name of monster to kill.
#       Count              Amount of monsters to kill. Set to 0 to skip the target on import.
#       Id                 Unique target index for the quest Id. Requires a positive number.
#       Race               Monster race target. (Default: All)
#       Size               Monster size target. (Default: All)
#       Element            Monster element target. (Default: All)
#       MinLevel           Minimum monster level target. If not supplied but MaxLevel defined, MinLevel is 1. Set to 0 to ignore MinLevel on import. (Default: 0)
#       MaxLevel           Maximum monster level target. Set to 0 to ignore MaxLevel on import. (Default: 0)
#       Location           Map name where kills are counted. (Default: All)
#       MapName            Displayed map name in quest UI. (Default: empty string)
#       MapMobTargets      List of monster names. Only names in the list will increase the kill counter. Only active when Id is used. (Default: all monsters)
#         <name>: <bool>   Monster name and whether the monster is added or removed from the list.
#   Drops:                 Quest item drop targets. (Default: null)
#     - Mob                Monster to kill. 0 will apply to all monsters. (Default: 0)
#       Item               Item to drop.
#       Count              Amount of items that will drop. Non-stackable items default to 1. (Default: 1)
#       Rate               Item drop rate. (10000 = 100%)
###########################################################################

Header:
  Type: QUEST_DB
  Version: 3

Body:
# mag_dun03 (Nogg Road 3F) - Lily Blanc's daily research quests
#=============================================================
# Ported from db/re/quest_db.yml:6011-6070. The 8550-8561 range
# is unused in db/pre-re/quest_db.yml, so no override conflict.
#
# Each of the four requests is a three-quest chain:
#   N   = the first-time version
#   N+1 = a 4h standby timer that gates the repeat
#   N+2 = the repeatable daily version
# The NPC (npc/custom/quests/mag_dun03_lily.txt) derives N+1 and
# N+2 arithmetically from N, so the ordering here matters.
  - Id: 8550
    Title: Dealer that caused abnormal evolution
    Targets:
      - Mob: DELETER1_H
        Count: 15
      - Mob: DELETER2_H
        Count: 15
  - Id: 8551
    Title: The Dealer That Caused Evolution (Standby)
    TimeLimit: 4h
  - Id: 8552
    Title: Reexamination of the Dealer that Caused the Evolution
    Targets:
      - Mob: DELETER1_H
        Count: 15
      - Mob: DELETER2_H
        Count: 15
  - Id: 8553
    Title: Eradicate the nightmare that became a reality
    Targets:
      - Mob: NIGHTMARE_TERROR_H
        Count: 10
  - Id: 8554
    Title: Eradicate the nightmare that became reality (Standby)
    TimeLimit: 4h
  - Id: 8555
    Title: Eradicate the terrifying nightmare that has become a reality
    Targets:
      - Mob: NIGHTMARE_TERROR_H
        Count: 10
  - Id: 8556
    Title: Check density
    Targets:
      - Mob: LAVA_GOLEM_H
        Count: 10
  - Id: 8557
    Title: Check Density (Standby)
    TimeLimit: 4h
  - Id: 8558
    Title: Check density once again
    Targets:
      - Mob: LAVA_GOLEM_H
        Count: 10
  - Id: 8559
    Title: Small things crumbling
    Targets:
      - Mob: BLAZZER_H
        Count: 10
      - Mob: EXPLOSION_H
        Count: 10
  - Id: 8560
    Title: Small Things (Standby)
    TimeLimit: 4h
  - Id: 8561
    Title: Very small things
    Targets:
      - Mob: BLAZZER_H
        Count: 10
      - Mob: EXPLOSION_H
        Count: 10
# iz_dun05 (Undersea Tunnel F6) - Nerin's daily survey requests
#=============================================================
# Brand new quests, not ported from renewal - nothing in
# db/re/quest_db.yml targets these mobs. The 8562-8573 range is
# unused in db/pre-re/quest_db.yml (which has no entries at all
# between 8550 and 8699) and continues the mag_dun03 block above
# contiguously, so there is no override conflict.
#
# Same three-quest chain shape as Lily's, because the NPC
# (npc/custom/quests/iz_dun05_nerin.txt) derives N+1 and N+2
# arithmetically from N - the ordering here matters:
#   N   = the first-time version
#   N+1 = a 4h standby timer that gates the repeat
#   N+2 = the repeatable daily version
#
# All four chains target ordinary map spawns. Chain D asked for
# Kraken Tentacles at first, which was a mistake - those exist
# only while the MVP is alive and summoning, so the chain could
# not be completed outside a 2h boss window. It is King Dramoh
# only now: boss-class, 130k HP, the hardest thing on the map
# short of the MVP, and always available.
  - Id: 8562
    Title: Counting the Drift
    Targets:
      - Mob: SEDORA
        Count: 15
  - Id: 8563
    Title: Counting the Drift (Standby)
    TimeLimit: 4h
  - Id: 8564
    Title: Counting the Drift Again
    Targets:
      - Mob: SEDORA
        Count: 15
  - Id: 8565
    Title: The Charge in the Water
    Targets:
      - Mob: SROPHO
        Count: 10
  - Id: 8566
    Title: The Charge in the Water (Standby)
    TimeLimit: 4h
  - Id: 8567
    Title: Measuring the Charge Again
    Targets:
      - Mob: SROPHO
        Count: 10
  - Id: 8568
    Title: What the Pots Carry
    Targets:
      - Mob: POT_DOFLE
        Count: 10
  - Id: 8569
    Title: What the Pots Carry (Standby)
    TimeLimit: 4h
  - Id: 8570
    Title: Opening the Pots Again
    Targets:
      - Mob: POT_DOFLE
        Count: 10
  - Id: 8571
    Title: The Shell That Will Not Open
    Targets:
      - Mob: KING_DRAMOH
        Count: 10
  - Id: 8572
    Title: The Shell That Will Not Open (Standby)
    TimeLimit: 4h
  - Id: 8573
    Title: Prying the Shell Again
    Targets:
      - Mob: KING_DRAMOH
        Count: 10
#=============================================================
# Prontera Sunday Market (npc/custom/prontera_market.txt)
#=============================================================
# 8574-8591. The range is free everywhere it matters: nothing
# between 8574 and 8699 exists in db/pre-re/quest_db.yml, the
# block above this one stops at 8573, and the client's
# questid2display.txt has no 857x/858x/859x entries either.
#
# Display text for all of these lives in
# D:\Client\data\questid2display.txt. Without it the quest
# window shows a blank row, so the two files must be edited
# together.
#
# -- Nanna's market errands, 8574-8578.
# A five-leg walk of the square with no combat in it, aimed at
# levels 1-15. Each leg is completed by the stallholder it
# points at, who sets the next one; Torv closes 8578 and sends
# the player back to Nanna for the payout. No Targets and no
# TimeLimit - these are pure "talk to the next person" markers.
  - Id: 8574
    Title: Market Errands - Elsa's Stall
  - Id: 8575
    Title: Market Errands - Pim's Loaves
  - Id: 8576
    Title: Market Errands - Wren's Posy
  - Id: 8577
    Title: Market Errands - Calder's Delivery
  - Id: 8578
    Title: Market Errands - Word to Torv
#
# -- Stallholder gathering requests, 8580-8588.
# Three chains on the same shape as Lily's and Nerin's above:
#   N   = the first-time version
#   N+1 = a standby timer that gates the repeat
#   N+2 = the repeatable version
# F_PrtMarketHunt in npc/custom/prontera_market.txt derives N+1
# and N+2 arithmetically from N, so the ordering here matters.
#
# The standby is 2h rather than Lily's 4h. These target Hornet
# (lv 8), Rocker (lv 9) and Vadon (lv 19) for players in the
# 10-30 band, where a four hour lockout is most of a play
# session; the exp involved is small enough that a shorter
# window is not worth farming.
  - Id: 8580
    Title: Smoke Out the Hives
    Targets:
      - Mob: HORNET
        Count: 20
  - Id: 8581
    Title: Smoke Out the Hives (Standby)
    TimeLimit: 2h
  - Id: 8582
    Title: The Hives Again
    Targets:
      - Mob: HORNET
        Count: 20
  - Id: 8583
    Title: Something in the Flowerbeds
    Targets:
      - Mob: ROCKER
        Count: 20
  - Id: 8584
    Title: Something in the Flowerbeds (Standby)
    TimeLimit: 2h
  - Id: 8585
    Title: The Flowerbeds Again
    Targets:
      - Mob: ROCKER
        Count: 20
  - Id: 8586
    Title: The Picked-Over Crab Beds
    Targets:
      - Mob: VADON
        Count: 15
  - Id: 8587
    Title: The Picked-Over Crab Beds (Standby)
    TimeLimit: 2h
  - Id: 8588
    Title: The Crab Beds Again
    Targets:
      - Mob: VADON
        Count: 15
#
# -- Market stamp card, 8590/8591.
# 8590 is the card in hand; which stalls have stamped it is a
# six-bit mask in the character variable prtmk_stamp, not a
# quest objective, because "talk to this NPC" is not something
# Targets can express. 8591 is the weekly lockout.
  - Id: 8590
    Title: Sunday Market Stamp Card
  - Id: 8591
    Title: Sunday Market Stamp Card (Standby)
    TimeLimit: +168h
